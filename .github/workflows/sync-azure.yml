name: Sync Azure location history
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Export sanitized locations
        run: npm run sync-azure
        env:
          AZURE_LOCATION_API_URL: ${{ secrets.AZURE_LOCATION_API_URL }}
          AZURE_LOCATION_API_TOKEN: ${{ secrets.AZURE_LOCATION_API_TOKEN }}
      - name: Publish history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/location-history.json
          git diff --cached --quiet || git commit -m 'Update location history'
          git push
