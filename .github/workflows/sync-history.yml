name: Legacy SmartThings sync (disabled)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Fetch and round location data
        run: npm run sync-history
        env:
          SMARTTHINGS_TOKEN: ${{ secrets.SMARTTHINGS_TOKEN }}
          SMARTTHINGS_LOCATION_ID: ${{ secrets.SMARTTHINGS_LOCATION_ID }}
          SMARTTHINGS_HISTORY_URL: ${{ secrets.SMARTTHINGS_HISTORY_URL }}
      - name: Publish changed history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/location-history.json
          git diff --cached --quiet || git commit -m 'Update location history'
          git push
