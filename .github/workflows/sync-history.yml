name: Sync SmartThings history

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch SmartThings history
        run: npm run sync-history
        env:
          SMARTTHINGS_TOKEN: ${{ secrets.SMARTTHINGS_TOKEN }}
          SMARTTHINGS_LOCATION_ID: ${{ secrets.SMARTTHINGS_LOCATION_ID }}
          SMARTTHINGS_HISTORY_URL: ${{ secrets.SMARTTHINGS_HISTORY_URL }}

      - name: Commit updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/location-history.json
          git diff --cached --quiet || git commit -m 'Update location history'
          git push
